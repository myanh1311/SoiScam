<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>SOISCAM - Đặt lại mật khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/fx.css">
    <link rel="stylesheet" href="./assets/css/login.css">
</head>

<body>
    <!-- IMAGES FIXED-->
    <div class="effect-circle-1"></div>
    <div class="effect-circle-2"></div>
    <!-- END IMAGES FIXED-->

    <div class="login-page">
        <a href="index.html" class="login-page__logo reveal-up-scroll">
            <img src="./assets/images/logo.png" alt="logo">
            <span>Soi scam</span>
        </a>

        <div class="login-box reveal-up-scroll" style="transition-delay:.08s">
            <form id="resetForm" class="login-box__form">
                <h1 class="login-box__title reveal-el" data-reveal="rise">Đặt lại mật khẩu</h1>
                <p class="login-box__desc" id="resetDesc">
                    Nhập mật khẩu mới cho tài khoản của bạn.
                </p>

                <div class="login-box__field">
                    <label for="resetPassword">Mật khẩu mới</label>
                    <input type="password" id="resetPassword" autocomplete="new-password" placeholder="Ít nhất 6 ký tự...">
                </div>
                <div class="login-box__field">
                    <label for="resetPasswordConfirm">Nhập lại mật khẩu mới</label>
                    <input type="password" id="resetPasswordConfirm" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới...">
                </div>

                <p id="resetError" class="login-box__error"></p>
                <p id="resetSuccess" class="login-box__error login-box__error--success" hidden>
                    Đặt lại mật khẩu thành công! Đang chuyển sang trang đăng nhập...
                </p>

                <button type="submit" id="resetSubmitBtn" class="btn login-box__submit">Đặt lại mật khẩu</button>
            </form>
        </div>
    </div>

    <!-- JS -->
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <script src="./assets/js/scammer-data.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/reset-password.js"></script>
    <script src="./assets/js/password-toggle.js"></script>
    <script src="./assets/js/reveal.js"></script>
    <!-- End JS -->
    <script src="./assets/js/fx.js"></script>
</body>

</html>
