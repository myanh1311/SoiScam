<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>SOISCAM - Gửi tố cáo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/lelinh014756/fui-toast-js@master/assets/css/toast@1.0.1/fuiToast.min.css">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/fx.css">
    <link rel="stylesheet" href="./assets/css/report.css">
</head>

<body>
    <div id="fui-toast"></div>
    <!-- Hiệu ứng ánh sáng nền -->
    <div class="effect-circle-1"></div>
    <div class="effect-circle-2"></div>
    <!-- Hết hiệu ứng ánh sáng nền -->

    <!-- Đầu trang -->
    <header class="header">
        <a href="index.html" class="header__logo">
            <img src="./assets/images/logo.png" alt="logo" class="header__logo-img">
            <span class="header_logo-name">Soi scam</span>
        </a>
        <ul class="header_nav-list" id="headerNavList">
            <li class="header_nav--item">
                <a href="index.html" class="header__nav-link">Trang chủ</a>
            </li>
            <li class="header_nav--item">
                <a href="./scammer-list.html" class="header__nav-link">Scamer</a>
            </li>
            <li class="header_nav--item">
                <a href="./report.html" class="header__nav-link active">Gửi tố cáo</a>
            </li>
            <li class="header_nav--item">
                <a href="./about.html" class="header__nav-link">Giới thiệu</a>
            </li>
        </ul>
        <div class="header__actions">
            <button type="button" class="header__burger" id="headerBurgerBtn" aria-label="Mở menu" aria-expanded="false" aria-controls="headerNavList">
                <svg class="header__burger-icon-open" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
                <svg class="header__burger-icon-close" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
            </button>
            <div id="headerAccount" class="header__account">
                <a href="login.html" class="header__auth-link">Đăng nhập</a>
            </div>
        </div>
    </header>
    <!-- Hết đầu trang -->

    <!-- Đường dẫn trang -->
    <section class="breadcrumb">
        <a href="index.html" class="breadcrumb__link">Trang chủ</a>
        <img src="./assets/images/arrow-right-2.svg" alt="" class="breadcrumb__icon">
        <a href="./report.html" class="breadcrumb__link active">Gửi tố cáo</a>
    </section>
    <!-- Hết đường dẫn trang -->

    <!-- Form tố cáo -->
    <form id="form-report" class="form-report reveal-up-scroll">
        <h2 class="form__heading reveal-el" data-reveal="rise">Thông tin kẻ lừa đảo</h2>
        <div class="form__group-wrap">
            <div class="form__group">
                <label for="nameScammer"
                class="form__title">Tên chủ tài khoản <span>*</span></label>
                <input type="text"
                placeholder="Nhập tên chủ tài khoản..."
                name="nameScammer" 
                id="nameScammer"
                class="form__input"/>
                <p class="form-message"></p>
            </div>
            <div class="form__group">
                <label for="phoneScammer" 
                class="form__title">Số điện thoại</label>
                <input type="text" 
                placeholder="Nhập số điện thoại..." 
                name="phoneScammer" 
                id="phoneScammer"
                class="form__input" />
                <p class="form-message"></p>
            </div>
        </div>
        <div class="form__group-wrap">
            <div class="form__group">
                <label for="bankNumber" 
                class="form__title">Số tài khoản<span>*</span></label>
                <input type="text" 
                placeholder="Nhập số tài khoản..." 
                name="bankNumber" 
                id="bankNumber"
                class="form__input" />
                <p class="form-message"></p>
            </div>
            <div class="form__group">
                <label for="bankName" 
                class="form__title">Ngân hàng<span>*</span></label>
                <input type="text" 
                placeholder="Nhập tên ngân hàng..." 
                name="bankName" 
                id="bankName"
                class="form__input" />
                <p class="form-message"></p>
            </div>
        </div>
        <div class="form__group form__group-textarea">
            <textarea 
            placeholder="Nhập nội dung tố cáo..." 
            name="contentReport" 
            id="contentReport"
            class="form__textarea"></textarea>
            <p class="form-message"></p>
        </div>
        <div class="form__upload-wrap">
             <div class="form__group form__upload-group">
            <label for="uploadImage" class="form__upload">
                <input 
                type="file" 
                name="images" 
                id="uploadImage" 
                class="form__upload-input"
                accept="image/*"
                multiple
                hidden/>
                <img 
                 src="./assets/images/image-icon.svg" 
                 alt="" 
                 class="form__upload-icon"/>
                 <span class="form__upload-text">Chọn ảnh</span>
            </label>
            <p class="form-message"></p>
        </div>
        </div>
        <h2 class="form__heading reveal-el" data-reveal="rise">Xác thực người gửi tố cáo</h2>
           <div class="form__group-wrap">
            <div class="form__group">
                <label for="nameSender" 
                class="form__title">Họ và tên <span>*</span></label>
                <input type="text" 
                placeholder="Nhập họ và tên..." 
                name="nameSender" 
                id="nameSender"
                class="form__input" />
                <p class="form-message"></p>
            </div>
            <div class="form__group">
                <label for="phoneSender" 
                class="form__title">Liên hệ (Zalo - Sđt)<span>*</span></label>
                <input type="text" 
                placeholder="Nhập số điện thoại..." 
                name="phoneSender" 
                id="phoneSender"
                class="form__input" />
                <p class="form-message"></p>
            </div>
        </div>
        <div class="form__action-group">
            <div class="form__action-item">
                <input 
                type="radio" 
                name="option" 
                id="option-1" 
                value="Tôi là nạn nhân" 
                class="form__radio-input"
                checked>
                <label for="option-1" class="form__title-radio">Tôi là nạn nhân</label>
            </div>
             <div class="form__action-item">
                <input 
                type="radio" 
                name="option" 
                id="option-2" 
                value="Tôi chỉ đăng hộ" 
                class="form__radio-input">
                <label for="option-2" class="form__title-radio">Tôi chỉ đăng hộ</label>
            </div>
        </div>
        <button type="submit" class="btn form-report__btn">Gửi tố cáo</button>
    </form>
    <!-- Hết form tố cáo -->

    <!-- Script -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/lelinh014756/fui-toast-js@master/assets/js/toast@1.0.1/fuiToast.min.js"></script>
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/tuanduong1907/fui-validate@main/fui-validate.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/scammer-data.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/header-nav.js"></script>
    <script src="./assets/js/report.js"></script>
    <script src="./assets/js/reveal.js"></script>
    <!-- Hết script -->
    <script src="./assets/js/fx.js"></script>
</body>

</html>
