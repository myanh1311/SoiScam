<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>SOISCAM - Quên mật khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/fx.css">
    <link rel="stylesheet" href="./assets/css/login.css">
</head>

<body>
    <!-- Hiệu ứng ánh sáng nền -->
    <div class="effect-circle-1"></div>
    <div class="effect-circle-2"></div>
    <!-- Hết hiệu ứng ánh sáng nền -->

    <div class="login-page">
        <a href="index.html" class="login-page__logo reveal-up-scroll">
            <img src="./assets/images/logo.png" alt="logo">
            <span>Soi scam</span>
        </a>

        <div class="login-box reveal-up-scroll" style="transition-delay:.08s">
            <!-- BƯỚC 1: nhập email để nhận mã -->
            <form id="forgotForm" class="login-box__form">
                <h1 class="login-box__title reveal-el" data-reveal="rise">Quên mật khẩu</h1>
                <p class="login-box__desc">
                    Nhập email đã đăng ký, chúng tôi sẽ gửi một mã xác nhận gồm 6 chữ số để bạn đặt lại mật khẩu.
                </p>

                <div class="login-box__field">
                    <label for="forgotEmail">Email</label>
                    <input type="email" id="forgotEmail" autocomplete="email" placeholder="Nhập email đã đăng ký...">
                </div>

                <p id="forgotError" class="login-box__error"></p>

                <button type="submit" id="forgotSubmitBtn" class="btn login-box__submit">Gửi mã xác nhận</button>

                <p class="login-box__switch">
                    <a href="login.html" class="login-box__link-btn">Quay lại đăng nhập</a>
                </p>
            </form>

            <!-- BƯỚC 2: nhập mã 6 số nhận được qua email -->
            <form id="codeForm" class="login-box__form" hidden>
                <h1 class="login-box__title">Nhập mã xác nhận</h1>
                <p class="login-box__desc" id="codeDesc">
                    Chúng tôi đã gửi mã gồm 6 chữ số tới email của bạn. Mã có hiệu lực trong 10 phút (kiểm tra cả mục Spam nhé).
                </p>

                <div class="login-box__field">
                    <label for="codeInput">Mã xác nhận</label>
                    <input type="text" id="codeInput" class="login-box__code-input" inputmode="numeric"
                        autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="------">
                </div>

                <p id="codeDev" class="login-box__error login-box__error--success" hidden></p>
                <p id="codeError" class="login-box__error"></p>

                <button type="submit" id="codeSubmitBtn" class="btn login-box__submit">Xác nhận</button>

                <p class="login-box__switch">
                    <button type="button" id="resendBtn" class="login-box__link-btn" disabled>Gửi lại mã</button>
                    ·
                    <button type="button" id="changeEmailBtn" class="login-box__link-btn">Đổi email</button>
                </p>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <script src="./assets/js/scammer-data.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/forgot-password.js"></script>
    <script src="./assets/js/reveal.js"></script>
    <!-- Hết script -->
    <script src="./assets/js/fx.js"></script>
</body>

</html>
